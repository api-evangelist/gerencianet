openapi: 3.2.0
info:
  title: Efí Pay Extratos (Statements) Statement Files API
  description: Recurring CNAB (Brazilian banking text-file) statement extraction for Efí Pay accounts. Schedule daily/weekly CNAB jobs, list generated files, and download them via the API or via SFTP using a generated key pair.
  version: '1.0'
  contact:
    name: Efí Pay Developer Support
    url: https://dev.efipay.com.br/docs/extrato-cnab
  license:
    name: Proprietary
servers:
- url: https://extratos.api.efipay.com.br/v1
  description: Production
- url: https://extratos-h.api.efipay.com.br/v1
  description: Homologation (Sandbox)
security:
- oauth2Extratos: []
tags:
- name: Statement Files
paths:
  /extrato-cnab/arquivos:
    get:
      tags:
      - Statement Files
      summary: List Statement Files
      operationId: listStatementFiles
      responses:
        '200':
          description: Files
  /extrato-cnab/download/{nome_arquivo}:
    get:
      tags:
      - Statement Files
      summary: Download Statement File
      operationId: getStatementFile
      parameters:
      - name: nome_arquivo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File contents
components:
  securitySchemes:
    oauth2Extratos:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://extratos.api.efipay.com.br/v1/oauth/token
          scopes: {}
